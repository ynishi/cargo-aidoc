[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2024"
authors = ["Yutaka Nishimura <ytk.nishimura@gmail.com>"]
license = "MIT OR Apache-2.0"
description = "Generate LLM-facing doc artifacts (llms.txt / markdown / machine JSON) from rustdoc JSON"
repository = "https://github.com/ynishi/cargo-aidoc"
homepage = "https://github.com/ynishi/cargo-aidoc"
documentation = "https://docs.rs/aidoc-core"
readme = "README.md"
keywords = ["rustdoc", "llm", "documentation", "cargo-subcommand", "mcp"]
categories = ["development-tools::cargo-plugins", "command-line-utilities"]

[workspace.dependencies]
aidoc-core = { path = "crates/aidoc-core", version = "0.3.0" }
cargo-aidoc = { path = "crates/cargo-aidoc", version = "0.3.0" }
aidoc-mcp = { path = "crates/aidoc-mcp", version = "0.3.0" }

# External dependencies
cargo_metadata = "0.23"
clap = { version = "4", features = ["derive"] }
rmcp = { version = "2", features = ["transport-io"] }
rustdoc-types = "0.60"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
